<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corner Frenzy</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    touch-action: manipulation;
  }
  #lobby {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  h1 { font-size: 1.7rem; color: #38bdf8; text-align: center; }
  input, button {
    font-size: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    width: 100%;
    max-width: 320px;
  }
  input { background: #1e293b; color: #fff; border: 1px solid #334155; }
  button {
    background: #0ea5e9;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  button.secondary { background: #334155; }
  button.success { background: #22c55e; }
  button.warn { background: #f59e0b; color: #111; }
  .row { display: flex; gap: 8px; width: 100%; max-width: 320px; }
  .row input { flex: 1; min-width: 0; }
  #roomInfo {
    background: #1e293b;
    padding: 14px 16px;
    border-radius: 12px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    display: none;
  }
  #roomCodeBox {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fbbf24;
    margin: 8px 0;
    word-break: break-all;
    user-select: all;
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
  }
  #playerListBox {
    margin-top: 10px;
    text-align: left;
    background: #0f172a;
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 60px;
  }
  #playerListBox .title {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  #playerListBox .pname {
    font-size: 14px;
    padding: 3px 0;
    color: #e2e8f0;
  }
  #playerListBox .pname.you { color: #86efac; }
  #playerListBox .pname.host { color: #fbbf24; }
  #lobbyBtns {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    width: 100%;
  }
  #statusLine {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 6px;
  }
  #levelSelect {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
  }
  .levelBtn { max-width: 280px; }
  #game {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
  }
  #arena {
    position: absolute;
    inset: 0 0 70px 0;
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 70%);
  }
  .pad {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1e3a5f;
    border: 3px solid #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #7dd3fc;
    z-index: 5;
    cursor: pointer;
  }
  .avatar {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    z-index: 10;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .avatar.you { background: #22c55e; border: 2px solid #86efac; }
  .avatar.friend { background: #a855f7; border: 2px solid #d8b4fe; }
  .avatar.ai { background: #3b82f6; border: 2px solid #93c5fd; }
  .avatar.displaced { animation: pulse 0.4s infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  #hunter {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ef4444;
    border: 3px solid #fca5a5;
    z-index: 8;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 16px rgba(239,68,68,0.6);
  }
  #hud {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 70px;
    background: #0f172a;
    border-top: 2px solid #1e293b;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    z-index: 20;
  }
  #speedWrap { flex: 1; }
  #speedLabel { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
  #speedBarBg {
    height: 18px;
    background: #1e293b;
    border-radius: 9px;
    overflow: hidden;
  }
  #speedBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444);
    border-radius: 9px;
    transition: width 0.1s;
  }
  #levelBadge {
    background: #1e293b;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #fbbf24;
    white-space: nowrap;
  }
  #msg {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,23,42,0.92);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 30;
    pointer-events: none;
    max-width: 92%;
    text-align: center;
  }
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #22c55e;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 50;
    display: none;
  }
</style>
</head>
<body>

<div id="lobby">
  <h1>Corner Frenzy</h1>
  <input id="nameInput" type="text" placeholder="Your name" maxlength="12">
  <button id="btnSolo" class="success">Play Solo (vs AI)</button>
  <button id="btnCreate">Create Room</button>
  <div class="row">
    <input id="codeInput" type="text" placeholder="Paste room code" maxlength="64">
    <button id="btnJoin" class="secondary">Join</button>
  </div>

  <div id="roomInfo">
    <div style="font-size:13px;color:#94a3b8;">Room Code (share this)</div>
    <div id="roomCodeBox">------</div>
    <button id="btnCopy" class="secondary">Copy Code</button>

    <div id="playerListBox">
      <div class="title">Players in room</div>
      <div id="playerList">—</div>
    </div>

    <div id="statusLine">Waiting for players…</div>

    <div id="lobbyBtns">
      <button id="btnStartAI" class="success">Start now (fill with AI)</button>
      <button id="btnWait" class="secondary">Keep waiting</button>
    </div>

    <div id="levelSelect">
      <div style="font-size:13px;color:#94a3b8;">Choose Level</div>
      <button class="levelBtn" data-level="1">Level 1 – Calm</button>
      <button class="levelBtn" data-level="2">Level 2 – Displacement</button>
      <button class="levelBtn" data-level="3">Level 3 – Furious Hunter</button>
    </div>
  </div>
</div>

<div id="game">
  <div id="arena"></div>
  <div id="hunter">👁</div>
  <div id="msg">Tap a corner to run!</div>
  <div id="hud">
    <div id="speedWrap">
      <div id="speedLabel">SPEED</div>
      <div id="speedBarBg"><div id="speedBar"></div></div>
    </div>
    <div id="levelBadge">L1</div>
  </div>
</div>

<div id="toast">Code copied!</div>

<script>
(function () {
  const MAX_PLAYERS = 6;
  const PAD_COUNT = 6;
  const PAD_RADIUS = 28;
  const AVATAR_R = 21;
  const HUNTER_R = 18;
  const HUNTER_SAFE = 48;

  let myName = '';
  let myId = '';
  let isHost = false;
  let roomCode = '';
  let level = 1;
  let gameRunning = false;
  let players = []; // {id, name, isAI, x, y, pad, targetPad, alive, moving, displaced}
  let hunter = { x: 0, y: 0, tx: 0, ty: 0 };
  let myPlayer = null;
  let clickBoost = 0;
  let lastClick = 0;
  let arenaW = 0, arenaH = 0;
  let pads = [];
  let audioCtx = null;
  let musicPlaying = false;

  // PeerJS
  let peer = null;
  let connections = {}; // peerId -> DataConnection
  let lobbyPlayers = []; // {id, name, isHost}

  const lobby = document.getElementById('lobby');
  const gameEl = document.getElementById('game');
  const arena = document.getElementById('arena');
  const hunterEl = document.getElementById('hunter');
  const msgEl = document.getElementById('msg');
  const speedBar = document.getElementById('speedBar');
  const levelBadge = document.getElementById('levelBadge');
  const roomInfo = document.getElementById('roomInfo');
  const roomCodeBox = document.getElementById('roomCodeBox');
  const playerListEl = document.getElementById('playerList');
  const levelSelect = document.getElementById('levelSelect');
  const statusLine = document.getElementById('statusLine');
  const toast = document.getElementById('toast');
  const lobbyBtns = document.getElementById('lobbyBtns');

  function showToast(t) {
    toast.textContent = t;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1600);
  }
  function setMsg(t) { msgEl.textContent = t; }

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function startMusic() {
    if (musicPlaying) return;
    ensureAudio();
    musicPlaying = true;
    const notes = [220, 277, 330, 277];
    let i = 0;
    function beat() {
      if (!musicPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = notes[i % notes.length];
      gain.gain.value = 0.035;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.stop(audioCtx.currentTime + 0.45);
      i++;
      setTimeout(beat, 480);
    }
    beat();
  }

  function refreshLobbyUI() {
    playerListEl.innerHTML = '';
    if (!lobbyPlayers.length) {
      playerListEl.textContent = '—';
      return;
    }
    lobbyPlayers.forEach(p => {
      const div = document.createElement('div');
      div.className = 'pname' + (p.id === myId ? ' you' : '') + (p.isHost ? ' host' : '');
      let label = p.name;
      if (p.id === myId) label += ' (you)';
      if (p.isHost) label += ' ★ host';
      div.textContent = label;
      playerListEl.appendChild(div);
    });
    const realCount = lobbyPlayers.length;
    const need = Math.max(0, MAX_PLAYERS - realCount);
    statusLine.textContent = realCount + ' player' + (realCount > 1 ? 's' : '') +
      ' joined · ' + need + ' AI will fill if you start';
  }

  function broadcast(msg) {
    const data = JSON.stringify(msg);
    Object.values(connections).forEach(conn => {
      if (conn.open) conn.send(data);
    });
  }

  function handleMessage(data, fromId) {
    let msg;
    try { msg = JSON.parse(data); } catch (e) { return; }

    if (msg.type === 'join') {
      // host receives join
      if (!isHost) return;
      if (lobbyPlayers.find(p => p.id === msg.id)) return;
      lobbyPlayers.push({ id: msg.id, name: msg.name, isHost: false });
      refreshLobbyUI();
      // send full list back to everyone
      broadcast({ type: 'lobby', players: lobbyPlayers });
      // also reply to this connection
      if (connections[fromId] && connections[fromId].open) {
        connections[fromId].send(JSON.stringify({ type: 'lobby', players: lobbyPlayers }));
      }
      showToast(msg.name + ' joined!');
    }

    if (msg.type === 'lobby') {
      lobbyPlayers = msg.players || [];
      refreshLobbyUI();
    }

    if (msg.type === 'start') {
      // receive start from host
      lobbyPlayers = msg.players || lobbyPlayers;
      startGame(msg.level || 1, true);
    }

    if (msg.type === 'move') {
      const pl = players.find(p => p.id === msg.id);
      if (pl && pl.id !== myId) {
        pl.targetPad = msg.pad;
        pl.moving = true;
      }
    }
  }

  function setupConnection(conn) {
    connections[conn.peer] = conn;
    conn.on('data', data => handleMessage(data, conn.peer));
    conn.on('close', () => {
      delete connections[conn.peer];
      if (isHost) {
        lobbyPlayers = lobbyPlayers.filter(p => p.id !== conn.peer);
        refreshLobbyUI();
        broadcast({ type: 'lobby', players: lobbyPlayers });
      }
    });
    conn.on('open', () => {
      if (!isHost) {
        // client tells host who we are
        conn.send(JSON.stringify({ type: 'join', id: myId, name: myName }));
      }
    });
  }

  // ============ GAME HELPERS (unchanged logic) ============
  function layoutPads() {
    pads = [];
    const cx = arenaW / 2;
    const cy = arenaH / 2;
    const R = Math.min(arenaW, arenaH) * 0.36;
    for (let i = 0; i < PAD_COUNT; i++) {
      const a = (Math.PI * 2 * i) / PAD_COUNT - Math.PI / 2;
      pads.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, id: i });
    }
  }
  function createPadElements() {
    arena.querySelectorAll('.pad').forEach(e => e.remove());
    pads.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'pad';
      el.style.left = (p.x - PAD_RADIUS) + 'px';
      el.style.top = (p.y - PAD_RADIUS) + 'px';
      el.textContent = (i + 1);
      el.addEventListener('click', () => onPadTap(i));
      el.addEventListener('touchstart', e => { e.preventDefault(); onPadTap(i); }, { passive: false });
      arena.appendChild(el);
    });
  }
  function clearAvatars() {
    arena.querySelectorAll('.avatar').forEach(e => e.remove());
  }
  function renderAvatars() {
    clearAvatars();
    players.forEach(pl => {
      if (!pl.alive) return;
      const el = document.createElement('div');
      el.className = 'avatar ' + (pl.id === myId ? 'you' : (pl.isAI ? 'ai' : 'friend'));
      if (pl.displaced) el.classList.add('displaced');
      el.style.left = (pl.x - AVATAR_R) + 'px';
      el.style.top = (pl.y - AVATAR_R) + 'px';
      el.textContent = (pl.name || '?').slice(0, 2).toUpperCase();
      el.title = pl.name;
      arena.appendChild(el);
    });
  }
  function placeHunter() {
    hunterEl.style.left = (hunter.x - HUNTER_R) + 'px';
    hunterEl.style.top = (hunter.y - HUNTER_R) + 'px';
  }
  function clampHunterAwayFromPads() {
    pads.forEach(p => {
      const dx = hunter.x - p.x;
      const dy = hunter.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d < HUNTER_SAFE && d > 0.1) {
        const push = (HUNTER_SAFE - d) / d;
        hunter.x += dx * push;
        hunter.y += dy * push;
      }
    });
    hunter.x = Math.max(HUNTER_R + 4, Math.min(arenaW - HUNTER_R - 4, hunter.x));
    hunter.y = Math.max(HUNTER_R + 4, Math.min(arenaH - HUNTER_R - 4, hunter.y));
  }

  function onPadTap(padIndex) {
    if (!gameRunning || !myPlayer || !myPlayer.alive) return;
    const now = Date.now();
    const dt = now - lastClick;
    lastClick = now;
    if (dt < 180) clickBoost = Math.min(1, clickBoost + 0.25);
    else if (dt < 350) clickBoost = Math.min(1, clickBoost + 0.12);
    else clickBoost = Math.max(0, clickBoost - 0.05);

    myPlayer.targetPad = padIndex;
    myPlayer.moving = true;

    // tell others
    broadcast({ type: 'move', id: myId, pad: padIndex });
  }

  function getOccupant(padIndex) {
    return players.find(p => p.alive && p.pad === padIndex && !p.moving);
  }

  function displacePlayer(pl) {
    pl.displaced = true;
    pl.moving = true;
    pl.pad = -1;
    const free = pads.map((_, i) => i).filter(i => !getOccupant(i));
    pl.targetPad = free.length ? free[Math.floor(Math.random() * free.length)] : Math.floor(Math.random() * PAD_COUNT);
    hunter.tx = pl.x;
    hunter.ty = pl.y;
    setMsg(pl.name + ' was displaced! Run!');
  }

  function updatePlayers(dt) {
    players.forEach(pl => {
      if (!pl.alive) return;
      if (pl.targetPad == null || pl.targetPad < 0) return;
      const target = pads[pl.targetPad];
      const dx = target.x - pl.x;
      const dy = target.y - pl.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 4) {
        const occupant = getOccupant(pl.targetPad);
        if (occupant && occupant.id !== pl.id) {
          if (level >= 2) displacePlayer(occupant);
          else {
            pl.targetPad = pl.pad >= 0 ? pl.pad : null;
            pl.moving = false;
            return;
          }
        }
        pl.x = target.x;
        pl.y = target.y;
        pl.pad = pl.targetPad;
        pl.targetPad = null;
        pl.moving = false;
        pl.displaced = false;
        return;
      }
      let base = pl.isAI ? 90 : 70;
      if (pl.id === myId) base += clickBoost * 140;
      if (pl.displaced) base *= 1.25;
      if (level === 3) base *= 1.1;
      const step = (base * dt) / 1000;
      const ratio = Math.min(1, step / dist);
      pl.x += dx * ratio;
      pl.y += dy * ratio;
      pl.moving = true;
    });
  }

  function updateHunter(dt) {
    let target = null, bestScore = -1;
    players.forEach(pl => {
      if (!pl.alive) return;
      let score = pl.displaced ? 100 : (pl.moving ? 60 : 20);
      const d = Math.hypot(pl.x - hunter.x, pl.y - hunter.y);
      score += Math.max(0, 40 - d / 10);
      if (score > bestScore) { bestScore = score; target = pl; }
    });
    if (target) { hunter.tx = target.x; hunter.ty = target.y; }
    const dx = hunter.tx - hunter.x;
    const dy = hunter.ty - hunter.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = level === 1 ? 55 : level === 2 ? 80 : 110;
    const step = (speed * dt) / 1000;
    hunter.x += (dx / dist) * Math.min(step, dist);
    hunter.y += (dy / dist) * Math.min(step, dist);
    clampHunterAwayFromPads();
    placeHunter();
    players.forEach(pl => {
      if (!pl.alive || (!pl.moving && !pl.displaced)) return;
      if (Math.hypot(pl.x - hunter.x, pl.y - hunter.y) < HUNTER_R + AVATAR_R - 4) {
        pl.alive = false;
        pl.moving = false;
        setMsg(pl.name + ' was tagged!');
        checkWin();
      }
    });
  }

  function checkWin() {
    const alive = players.filter(p => p.alive);
    if (alive.length <= 1) {
      gameRunning = false;
      setMsg(alive.length === 1 ? (alive[0].name + ' wins!') : 'No one left!');
      setTimeout(() => {
        gameEl.style.display = 'none';
        lobby.style.display = 'flex';
        if (isHost || lobbyPlayers.length) {
          roomInfo.style.display = 'block';
          levelSelect.style.display = 'none';
          lobbyBtns.style.display = 'flex';
        }
      }, 2500);
    }
  }

  function aiThink() {
    players.forEach(pl => {
      if (!pl.isAI || !pl.alive || pl.moving) return;
      if (Math.random() < 0.008 * level) {
        let candidates = pads.map((_, i) => i);
        if (level === 1) candidates = candidates.filter(i => !getOccupant(i));
        if (candidates.length) {
          pl.targetPad = candidates[Math.floor(Math.random() * candidates.length)];
          pl.moving = true;
        }
      }
    });
  }

  let lastTs = 0;
  function loop(ts) {
    if (!gameRunning) return;
    const dt = Math.min(50, ts - (lastTs || ts));
    lastTs = ts;
    clickBoost = Math.max(0, clickBoost - dt * 0.0008);
    speedBar.style.width = (clickBoost * 100) + '%';
    updatePlayers(dt);
    updateHunter(dt);
    aiThink();
    renderAvatars();
    requestAnimationFrame(loop);
  }

  function startGame(chosenLevel, fromNetwork) {
    level = chosenLevel || 1;
    levelBadge.textContent = 'L' + level;
    ensureAudio();
    startMusic();

    arenaW = arena.clientWidth || window.innerWidth;
    arenaH = arena.clientHeight || (window.innerHeight - 70);
    layoutPads();
    createPadElements();

    // Build from lobbyPlayers (real names) then AI fill
    const reals = (lobbyPlayers.length ? lobbyPlayers : [{ id: myId, name: myName, isHost: true }]);
    players = [];
    const usedPads = new Set();
    reals.forEach((r, idx) => {
      let pad = idx % PAD_COUNT;
      while (usedPads.has(pad)) pad = (pad + 1) % PAD_COUNT;
      usedPads.add(pad);
      players.push({
        id: r.id,
        name: r.name,
        isAI: false,
        x: pads[pad].x,
        y: pads[pad].y,
        pad,
        targetPad: null,
        alive: true,
        moving: false,
        displaced: false
      });
    });
    let aiN = 0;
    while (players.length < MAX_PLAYERS) {
      let freePad = 0;
      while (usedPads.has(freePad) && freePad < PAD_COUNT) freePad++;
      if (freePad >= PAD_COUNT) freePad = players.length % PAD_COUNT;
      usedPads.add(freePad);
      aiN++;
      players.push({
        id: 'ai' + aiN,
        name: 'AI-' + aiN,
        isAI: true,
        x: pads[freePad].x,
        y: pads[freePad].y,
        pad: freePad,
        targetPad: null,
        alive: true,
        moving: false,
        displaced: false
      });
    }

    myPlayer = players.find(p => p.id === myId) || players[0];

    hunter.x = arenaW / 2;
    hunter.y = arenaH / 2;
    hunter.tx = hunter.x;
    hunter.ty = hunter.y;
    clampHunterAwayFromPads();
    placeHunter();

    if (isHost && !fromNetwork) {
      broadcast({ type: 'start', level, players: lobbyPlayers });
    }

    lobby.style.display = 'none';
    gameEl.style.display = 'block';
    gameRunning = true;
    lastTs = 0;
    setMsg(level === 1 ? 'Level 1 – Stay safe!' : level === 2 ? 'Displacement ON!' : 'Furious Hunter!');
    renderAvatars();
    requestAnimationFrame(loop);
  }

  // ============ LOBBY ACTIONS ============
  document.getElementById('btnSolo').onclick = () => {
    ensureAudio();
    myName = document.getElementById('nameInput').value.trim() || 'Player';
    myId = 'solo_' + Math.random().toString(36).slice(2, 8);
    isHost = true;
    lobbyPlayers = [{ id: myId, name: myName, isHost: true }];
    roomCode = 'SOLO';
    roomCodeBox.textContent = 'SOLO';
    roomInfo.style.display = 'block';
    lobbyBtns.style.display = 'none';
    levelSelect.style.display = 'flex';
    statusLine.textContent = 'Solo mode – AI will fill all other spots';
    refreshLobbyUI();
  };

  document.getElementById('btnCreate').onclick = () => {
    ensureAudio();
    myName = document.getElementById('nameInput').value.trim() || 'Player';
    isHost = true;
    lobbyPlayers = [];
    connections = {};

    peer = new Peer();
    peer.on('open', id => {
      myId = id;
      roomCode = id;
      roomCodeBox.textContent = id;
      lobbyPlayers = [{ id: myId, name: myName, isHost: true }];
      roomInfo.style.display = 'block';
      lobbyBtns.style.display = 'flex';
      levelSelect.style.display = 'none';
      refreshLobbyUI();
      showToast('Room created – share the code');
    });
    peer.on('connection', conn => {
      setupConnection(conn);
    });
    peer.on('error', err => {
      console.warn(err);
      statusLine.textContent = 'Connection issue – try Create again';
    });
  };

  document.getElementById('btnCopy').onclick = () => {
    const code = roomCodeBox.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(() => showToast('Code copied!'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Code copied!');
    }
  };

  document.getElementById('btnJoin').onclick = () => {
    ensureAudio();
    myName = document.getElementById('nameInput').value.trim() || 'Player';
    const code = document.getElementById('codeInput').value.trim();
    if (!code) {
      alert('Paste the room code from your friend');
      return;
    }
    isHost = false;
    roomCode = code;
    roomCodeBox.textContent = code;
    lobbyPlayers = [];
    connections = {};

    peer = new Peer();
    peer.on('open', id => {
      myId = id;
      const conn = peer.connect(code, { reliable: true });
      setupConnection(conn);
      conn.on('open', () => {
        roomInfo.style.display = 'block';
        lobbyBtns.style.display = 'none'; // only host starts
        levelSelect.style.display = 'none';
        statusLine.textContent = 'Joined! Waiting for host to start…';
        showToast('Joined successfully');
        // join message sent in setupConnection on open
      });
      conn.on('error', () => {
        statusLine.textContent = 'Could not join – check code / internet';
      });
    });
    peer.on('error', err => {
      console.warn(err);
      statusLine.textContent = 'Join failed – check the code and try again';
    });
  };

  document.getElementById('btnStartAI').onclick = () => {
    if (!isHost && roomCode !== 'SOLO') return;
    levelSelect.style.display = 'flex';
    lobbyBtns.style.display = 'none';
    statusLine.textContent = 'Pick a level to start (AI fills empty spots)';
  };

  document.getElementById('btnWait').onclick = () => {
    statusLine.textContent = 'Waiting for more players… share the code again if needed';
    showToast('Still waiting');
  };

  document.querySelectorAll('.levelBtn').forEach(btn => {
    btn.onclick = () => {
      const lv = parseInt(btn.dataset.level, 10);
      startGame(lv, false);
    };
  });

  window.addEventListener('resize', () => {
    if (!gameRunning) return;
    arenaW = arena.clientWidth;
    arenaH = arena.clientHeight;
    layoutPads();
    createPadElements();
  });
})();
</script>
</body>
</html>
