<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corner Frenzy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    touch-action: manipulation;
  }
  #lobby {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    gap: 14px;
  }
  h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 8px; text-align: center; }
  input, button {
    font-size: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    width: 100%;
    max-width: 300px;
  }
  input { background: #1e293b; color: #fff; border: 1px solid #334155; }
  button {
    background: #0ea5e9;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  button.secondary { background: #334155; }
  button.danger { background: #ef4444; }
  button.success { background: #22c55e; }
  .row { display: flex; gap: 8px; width: 100%; max-width: 300px; }
  .row input { flex: 1; }
  #roomInfo {
    background: #1e293b;
    padding: 12px 16px;
    border-radius: 10px;
    width: 100%;
    max-width: 300px;
    text-align: center;
    display: none;
  }
  #roomCodeBox {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fbbf24;
    margin: 8px 0;
    user-select: all;
  }
  #playerList { margin-top: 8px; font-size: 0.9rem; color: #94a3b8; }
  #game {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
  }
  #arena {
    position: absolute;
    inset: 0 0 70px 0;
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 70%);
  }
  .pad {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1e3a5f;
    border: 3px solid #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #7dd3fc;
    z-index: 5;
    cursor: pointer;
  }
  .pad.occupied { border-color: #94a3b8; }
  .avatar {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    z-index: 10;
    pointer-events: none;
    transition: left 0.05s linear, top 0.05s linear;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .avatar.you { background: #22c55e; border: 2px solid #86efac; }
  .avatar.friend { background: #a855f7; border: 2px solid #d8b4fe; }
  .avatar.ai { background: #3b82f6; border: 2px solid #93c5fd; }
  .avatar.displaced { animation: pulse 0.4s infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  #hunter {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ef4444;
    border: 3px solid #fca5a5;
    z-index: 8;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 16px rgba(239,68,68,0.6);
    transition: left 0.08s linear, top 0.08s linear;
  }
  #hud {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #0f172a;
    border-top: 2px solid #1e293b;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    z-index: 20;
  }
  #speedWrap {
    flex: 1;
  }
  #speedLabel {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 2px;
  }
  #speedBarBg {
    height: 18px;
    background: #1e293b;
    border-radius: 9px;
    overflow: hidden;
  }
  #speedBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444);
    border-radius: 9px;
    transition: width 0.1s;
  }
  #levelBadge {
    background: #1e293b;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #fbbf24;
    white-space: nowrap;
  }
  #msg {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,23,42,0.9);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 30;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  #levelSelect {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .levelBtn {
    max-width: 260px;
  }
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #22c55e;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 50;
    display: none;
  }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <h1>Corner Frenzy</h1>
  <input id="nameInput" type="text" placeholder="Your name" maxlength="12" value="">
  <button id="btnSolo" class="success">Play Solo (vs AI)</button>
  <button id="btnCreate">Create Room</button>
  <div class="row">
    <input id="codeInput" type="text" placeholder="Room code" maxlength="8">
    <button id="btnJoin" class="secondary">Join</button>
  </div>

  <div id="roomInfo">
    <div>Room Code</div>
    <div id="roomCodeBox">------</div>
    <button id="btnCopy" class="secondary" style="margin-top:6px;">Copy Code</button>
    <div id="playerList">Players: —</div>
    <button id="btnStart" class="success" style="margin-top:12px;">Start Game</button>
    <div id="levelSelect">
      <div style="font-size:13px;color:#94a3b8;">Choose Level</div>
      <button class="levelBtn" data-level="1">Level 1 – Calm</button>
      <button class="levelBtn" data-level="2">Level 2 – Displacement</button>
      <button class="levelBtn" data-level="3">Level 3 – Furious Hunter</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div id="arena"></div>
  <div id="hunter">👁</div>
  <div id="msg">Tap a corner to run!</div>
  <div id="hud">
    <div id="speedWrap">
      <div id="speedLabel">SPEED</div>
      <div id="speedBarBg"><div id="speedBar"></div></div>
    </div>
    <div id="levelBadge">L1</div>
  </div>
</div>

<div id="toast">Code copied!</div>

<script>
(function() {
  // ============ CONFIG ============
  const MAX_PLAYERS = 6;
  const PAD_COUNT = 6;
  const PAD_RADIUS = 28;
  const AVATAR_R = 21;
  const HUNTER_R = 18;
  const HUNTER_SAFE = 48; // min distance from any pad center

  // ============ STATE ============
  let myName = '';
  let myId = Math.random().toString(36).slice(2, 8);
  let isHost = false;
  let roomCode = '';
  let level = 1;
  let gameRunning = false;
  let players = []; // {id, name, isAI, x, y, pad, targetPad, speed, alive, color}
  let hunter = { x: 0, y: 0, tx: 0, ty: 0, lookAngle: 0 };
  let myPlayer = null;
  let clickBoost = 0;
  let lastClick = 0;
  let arenaW = 0, arenaH = 0;
  let pads = [];
  let audioCtx = null;
  let musicPlaying = false;

  // ============ DOM ============
  const lobby = document.getElementById('lobby');
  const gameEl = document.getElementById('game');
  const arena = document.getElementById('arena');
  const hunterEl = document.getElementById('hunter');
  const msgEl = document.getElementById('msg');
  const speedBar = document.getElementById('speedBar');
  const levelBadge = document.getElementById('levelBadge');
  const roomInfo = document.getElementById('roomInfo');
  const roomCodeBox = document.getElementById('roomCodeBox');
  const playerList = document.getElementById('playerList');
  const levelSelect = document.getElementById('levelSelect');
  const toast = document.getElementById('toast');

  // ============ AUDIO (simple looping tone music) ============
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startMusic() {
    if (musicPlaying) return;
    ensureAudio();
    musicPlaying = true;
    // Simple ambient loop using oscillators
    const notes = [220, 277, 330, 277];
    let i = 0;
    function beat() {
      if (!musicPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = notes[i % notes.length];
      gain.gain.value = 0.04;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.stop(audioCtx.currentTime + 0.45);
      i++;
      setTimeout(beat, 480);
    }
    beat();
  }

  // ============ HELPERS ============
  function showToast(t) {
    toast.textContent = t;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  }

  function setMsg(t) {
    msgEl.textContent = t;
  }

  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }

  function layoutPads() {
    pads = [];
    const cx = arenaW / 2;
    const cy = arenaH / 2;
    const R = Math.min(arenaW, arenaH) * 0.36;
    for (let i = 0; i < PAD_COUNT; i++) {
      const a = (Math.PI * 2 * i) / PAD_COUNT - Math.PI / 2;
      const x = cx + Math.cos(a) * R;
      const y = cy + Math.sin(a) * R;
      pads.push({ x, y, id: i });
    }
  }

  function createPadElements() {
    arena.querySelectorAll('.pad').forEach(e => e.remove());
    pads.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'pad';
      el.style.left = (p.x - PAD_RADIUS) + 'px';
      el.style.top = (p.y - PAD_RADIUS) + 'px';
      el.dataset.pad = i;
      el.textContent = (i + 1);
      el.addEventListener('click', () => onPadTap(i));
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onPadTap(i); }, { passive: false });
      arena.appendChild(el);
    });
  }

  function clearAvatars() {
    arena.querySelectorAll('.avatar').forEach(e => e.remove());
  }

  function renderAvatars() {
    clearAvatars();
    players.forEach(pl => {
      if (!pl.alive) return;
      const el = document.createElement('div');
      el.className = 'avatar ' + (pl.id === myId ? 'you' : (pl.isAI ? 'ai' : 'friend'));
      if (pl.displaced) el.classList.add('displaced');
      el.style.left = (pl.x - AVATAR_R) + 'px';
      el.style.top = (pl.y - AVATAR_R) + 'px';
      el.textContent = pl.name.slice(0, 2).toUpperCase();
      el.title = pl.name;
      arena.appendChild(el);
    });
  }

  function placeHunter() {
    hunterEl.style.left = (hunter.x - HUNTER_R) + 'px';
    hunterEl.style.top = (hunter.y - HUNTER_R) + 'px';
  }

  // Keep hunter away from pads
  function clampHunterAwayFromPads() {
    pads.forEach(p => {
      const dx = hunter.x - p.x;
      const dy = hunter.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d < HUNTER_SAFE && d > 0.1) {
        const push = (HUNTER_SAFE - d) / d;
        hunter.x += dx * push;
        hunter.y += dy * push;
      }
    });
    // keep inside arena
    hunter.x = Math.max(HUNTER_R + 4, Math.min(arenaW - HUNTER_R - 4, hunter.x));
    hunter.y = Math.max(HUNTER_R + 4, Math.min(arenaH - HUNTER_R - 4, hunter.y));
  }

  // ============ GAME LOGIC ============
  function onPadTap(padIndex) {
    if (!gameRunning || !myPlayer || !myPlayer.alive) return;
    const now = Date.now();
    const dt = now - lastClick;
    lastClick = now;
    // faster clicks = higher boost
    if (dt < 180) clickBoost = Math.min(1, clickBoost + 0.25);
    else if (dt < 350) clickBoost = Math.min(1, clickBoost + 0.12);
    else clickBoost = Math.max(0, clickBoost - 0.05);

    myPlayer.targetPad = padIndex;
    myPlayer.moving = true;
  }

  function getOccupant(padIndex) {
    return players.find(p => p.alive && p.pad === padIndex && !p.moving);
  }

  function displacePlayer(pl) {
    pl.displaced = true;
    pl.moving = true;
    pl.pad = -1;
    // pick a free pad
    const free = pads.map((_, i) => i).filter(i => !getOccupant(i) && i !== pl.targetPad);
    if (free.length) {
      pl.targetPad = free[Math.floor(Math.random() * free.length)];
    } else {
      pl.targetPad = Math.floor(Math.random() * PAD_COUNT);
    }
    // hunter chases displaced
    hunter.tx = pl.x;
    hunter.ty = pl.y;
    setMsg(pl.name + ' was displaced! Run!');
  }

  function updatePlayers(dt) {
    players.forEach(pl => {
      if (!pl.alive) return;
      if (pl.targetPad == null || pl.targetPad < 0) return;

      const target = pads[pl.targetPad];
      const dx = target.x - pl.x;
      const dy = target.y - pl.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 4) {
        // arrived
        const occupant = getOccupant(pl.targetPad);
        if (occupant && occupant.id !== pl.id) {
          // displacement rule (level 2+)
          if (level >= 2) {
            displacePlayer(occupant);
          } else {
            // level 1: cannot take occupied
            pl.targetPad = pl.pad >= 0 ? pl.pad : null;
            pl.moving = false;
            return;
          }
        }
        pl.x = target.x;
        pl.y = target.y;
        pl.pad = pl.targetPad;
        pl.targetPad = null;
        pl.moving = false;
        pl.displaced = false;
        return;
      }

      // speed
      let base = pl.isAI ? 90 : 70;
      if (pl.id === myId) base += clickBoost * 140;
      if (pl.displaced) base *= 1.25;
      if (level === 3) base *= 1.1;

      const step = (base * dt) / 1000;
      const ratio = Math.min(1, step / dist);
      pl.x += dx * ratio;
      pl.y += dy * ratio;
      pl.moving = true;
    });
  }

  function updateHunter(dt) {
    // find best target: displaced first, then moving, then idle
    let target = null;
    let bestScore = -1;
    players.forEach(pl => {
      if (!pl.alive) return;
      let score = 0;
      if (pl.displaced) score = 100;
      else if (pl.moving) score = 60;
      else score = 20;
      // closer = better
      const d = Math.hypot(pl.x - hunter.x, pl.y - hunter.y);
      score += Math.max(0, 40 - d / 10);
      if (score > bestScore) {
        bestScore = score;
        target = pl;
      }
    });

    if (target) {
      hunter.tx = target.x;
      hunter.ty = target.y;
    }

    const dx = hunter.tx - hunter.x;
    const dy = hunter.ty - hunter.y;
    const dist = Math.hypot(dx, dy) || 1;
    let speed = level === 1 ? 55 : level === 2 ? 80 : 110;
    const step = (speed * dt) / 1000;
    hunter.x += (dx / dist) * Math.min(step, dist);
    hunter.y += (dy / dist) * Math.min(step, dist);

    clampHunterAwayFromPads();
    placeHunter();

    // tag check — only while player is moving / displaced
    players.forEach(pl => {
      if (!pl.alive) return;
      if (!pl.moving && !pl.displaced) return;
      const d = Math.hypot(pl.x - hunter.x, pl.y - hunter.y);
      if (d < HUNTER_R + AVATAR_R - 4) {
        pl.alive = false;
        pl.moving = false;
        setMsg(pl.name + ' was tagged!');
        checkWin();
      }
    });
  }

  function checkWin() {
    const alive = players.filter(p => p.alive);
    if (alive.length <= 1) {
      gameRunning = false;
      if (alive.length === 1) {
        setMsg(alive[0].name + ' wins!');
      } else {
        setMsg('No one left!');
      }
      setTimeout(() => {
        // return to lobby options
        gameEl.style.display = 'none';
        lobby.style.display = 'flex';
        levelSelect.style.display = 'flex';
        roomInfo.style.display = 'block';
      }, 2500);
    }
  }

  function aiThink() {
    players.forEach(pl => {
      if (!pl.isAI || !pl.alive || pl.moving) return;
      // random chance to move
      if (Math.random() < 0.008 * level) {
        let candidates = pads.map((_, i) => i);
        if (level === 1) {
          candidates = candidates.filter(i => !getOccupant(i));
        }
        if (candidates.length) {
          pl.targetPad = candidates[Math.floor(Math.random() * candidates.length)];
          pl.moving = true;
        }
      }
    });
  }

  let lastTs = 0;
  function loop(ts) {
    if (!gameRunning) return;
    const dt = Math.min(50, ts - (lastTs || ts));
    lastTs = ts;

    // decay click boost
    clickBoost = Math.max(0, clickBoost - dt * 0.0008);
    speedBar.style.width = (clickBoost * 100) + '%';

    updatePlayers(dt);
    updateHunter(dt);
    aiThink();
    renderAvatars();

    requestAnimationFrame(loop);
  }

  // ============ START GAME ============
  function startGame(chosenLevel) {
    level = chosenLevel || 1;
    levelBadge.textContent = 'L' + level;
    ensureAudio();
    startMusic();

    arenaW = arena.clientWidth || window.innerWidth;
    arenaH = arena.clientHeight || (window.innerHeight - 70);
    layoutPads();
    createPadElements();

    // build players list: real ones first, then AI fill
    const real = players.filter(p => !p.isAI);
    players = [];
    real.forEach((r, idx) => {
      const pad = idx % PAD_COUNT;
      players.push({
        id: r.id,
        name: r.name,
        isAI: false,
        x: pads[pad].x,
        y: pads[pad].y,
        pad,
        targetPad: null,
        alive: true,
        moving: false,
        displaced: false
      });
    });
    // AI fill
    let aiCount = 0;
    while (players.length < MAX_PLAYERS) {
      const pad = players.length % PAD_COUNT;
      // if pad taken, find free
      let freePad = pads.findIndex((_, i) => !players.some(p => p.pad === i));
      if (freePad < 0) freePad = players.length % PAD_COUNT;
      aiCount++;
      players.push({
        id: 'ai' + aiCount,
        name: 'AI-' + aiCount,
        isAI: true,
        x: pads[freePad].x,
        y: pads[freePad].y,
        pad: freePad,
        targetPad: null,
        alive: true,
        moving: false,
        displaced: false
      });
    }

    myPlayer = players.find(p => p.id === myId);

    // hunter starts in center
    hunter.x = arenaW / 2;
    hunter.y = arenaH / 2;
    hunter.tx = hunter.x;
    hunter.ty = hunter.y;
    clampHunterAwayFromPads();
    placeHunter();

    lobby.style.display = 'none';
    gameEl.style.display = 'block';
    gameRunning = true;
    lastTs = 0;
    setMsg(level === 1 ? 'Level 1 – Stay safe!' : level === 2 ? 'Displacement ON!' : 'Furious Hunter!');
    renderAvatars();
    requestAnimationFrame(loop);
  }

  // ============ LOBBY ACTIONS ============
  function refreshPlayerList() {
    const names = players.map(p => p.name + (p.id === myId ? ' (you)' : '')).join(', ');
    playerList.textContent = 'Players: ' + (names || '—');
  }

  document.getElementById('btnSolo').onclick = () => {
    ensureAudio();
    myName = document.getElementById('nameInput').value.trim() || 'Player';
    myId = Math.random().toString(36).slice(2, 8);
    isHost = true;
    players = [{ id: myId, name: myName, isAI: false }];
    roomCode = 'SOLO';
    roomCodeBox.textContent = 'SOLO';
    roomInfo.style.display = 'block';
    levelSelect.style.display = 'flex';
    document.getElementById('btnStart').style.display = 'none';
    refreshPlayerList();
  };

  document.getElementById('btnCreate').onclick = () => {
    ensureAudio();
    myName = document.getElementById('nameInput').value.trim() || 'Player';
    myId = Math.random().toString(36).slice(2, 8);
    isHost = true;
    roomCode = genCode();
    players = [{ id: myId, name: myName, isAI: false }];
    roomCodeBox.textContent = roomCode;
    roomInfo.style.display = 'block';
    levelSelect.style.display = 'flex';
    document.getElementById('btnStart').style.display = 'block';
    refreshPlayerList();
    // store in localStorage so same-device join can work for testing
    localStorage.setItem('cf_room_' + roomCode, JSON.stringify({
      host: myName,
      players: players.map(p => ({ id: p.id, name: p.name }))
    }));
  };

  document.getElementById('btnCopy').onclick = () => {
    const code = roomCodeBox.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(() => showToast('Code copied!'));
    } else {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Code copied!');
    }
  };

  document.getElementById('btnJoin').onclick = () => {
    ensureAudio();
    myName = document.getElementById('nameInput').value.trim() || 'Player';
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code || code.length < 4) {
      alert('Enter a valid room code');
      return;
    }
    roomCode = code;
    myId = Math.random().toString(36).slice(2, 8);
    isHost = false;

    // try localStorage (same device / same browser test)
    const raw = localStorage.getItem('cf_room_' + code);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        players = data.players.map(p => ({ id: p.id, name: p.name, isAI: false }));
        // add self if not already
        if (!players.find(p => p.name === myName)) {
          players.push({ id: myId, name: myName, isAI: false });
          data.players = players.map(p => ({ id: p.id, name: p.name }));
          localStorage.setItem('cf_room_' + code, JSON.stringify(data));
        } else {
          // update id for same name
          const existing = players.find(p => p.name === myName);
          if (existing) myId = existing.id;
        }
      } catch (e) {
        players = [{ id: myId, name: myName, isAI: false }];
      }
    } else {
      // no room found – still allow join as local demo
      players = [
        { id: 'host', name: 'Host', isAI: false },
        { id: myId, name: myName, isAI: false }
      ];
    }

    roomCodeBox.textContent = roomCode;
    roomInfo.style.display = 'block';
    levelSelect.style.display = 'flex';
    document.getElementById('btnStart').style.display = 'block';
    refreshPlayerList();
    showToast('Joined room ' + roomCode);
  };

  document.getElementById('btnStart').onclick = () => {
    levelSelect.style.display = 'flex';
    setMsg('Choose a level to start');
  };

  document.querySelectorAll('.levelBtn').forEach(btn => {
    btn.onclick = () => {
      const lv = parseInt(btn.dataset.level, 10);
      startGame(lv);
    };
  });

  // resize
  window.addEventListener('resize', () => {
    if (!gameRunning) return;
    arenaW = arena.clientWidth;
    arenaH = arena.clientHeight;
    layoutPads();
    createPadElements();
  });
})();
</script>
</body>
</html>
